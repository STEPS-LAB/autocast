# Autocast — nginx reverse proxy for the self-hosted Next.js server.
#
# Install:
#   sudo cp deploy/nginx-cache.conf /etc/nginx/conf.d/autocast-cache.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/autocast
#   sudo ln -s /etc/nginx/sites-available/autocast /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d example.com -d www.example.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream autocast_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot rewrites this block to redirect to HTTPS. Until then:
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.

    # Admin imports post Excel files; next.config.ts allows bodies up to 50 MB.
    client_max_body_size 50m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/rss+xml;

    # ─── Hashed build assets ────────────────────────────────────────────────
    # Next already sends immutable Cache-Control here; just proxy and let the
    # browser cache do the work.
    location /_next/static/ {
        proxy_pass http://autocast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        access_log off;
    }

    # ─── Optimized images ───────────────────────────────────────────────────
    # AVIF/WebP encoding is the heaviest CPU work in the app. Caching here
    # keeps a single-core VPS from re-encoding the same catalog images.
    location /_next/image {
        proxy_pass http://autocast_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_cache autocast_images;
        proxy_cache_valid 200 30d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ─── Admin imports: long-running streamed responses ─────────────────────
    # These routes stream progress as they parse; buffering would hold the
    # whole response until the import finishes.
    location ~ ^/api/admin/import- {
        proxy_pass http://autocast_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
    }

    # ─── Everything else ────────────────────────────────────────────────────
    location / {
        proxy_pass http://autocast_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # getSiteUrl() reads these two — wrong values break auth redirects.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # App Router streams RSC payloads and Suspense boundaries; buffering
        # them defeats streaming and delays first paint.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
