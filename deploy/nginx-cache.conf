# Image cache zone used by deploy/nginx.conf.
# Must live in the `http` context, so install it separately:
#   sudo cp deploy/nginx-cache.conf /etc/nginx/conf.d/autocast-cache.conf
#
# 1 GB on disk holds a large catalog's worth of AVIF/WebP variants and spares
# a single-core VPS from re-encoding them on every request.

proxy_cache_path /var/cache/nginx/autocast_images
                 levels=1:2
                 keys_zone=autocast_images:10m
                 max_size=1g
                 inactive=30d
                 use_temp_path=off;
